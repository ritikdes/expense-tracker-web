{% extends "base.html" %}
{% block content %}
<h2>Register</h2>

<div class="form-container">
    <form action="{{url_for('register')}}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required placeholder="Enter username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="password" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn-submit">Register</button>
    </form>
    <p>Already have an account?</p> <a href="{{url_for('login')}}">Login</a>
</div>
{% endblock %}
